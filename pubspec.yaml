name: mis_finanzas_app
description: Aplicación personal de finanzas.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  shared_preferences: ^2.5.3
  image_picker: ^1.2.0
  path_provider: ^2.1.5
  file_picker: ^10.3.3
  share_plus: ^12.0.0
  cross_file: ^0.3.4+2
  excel: ^4.0.6

  google_sign_in: ^7.2.0
  google_sign_in_android: ^7.2.17
  google_sign_in_web: ^1.1.3
  googleapis: ^15.0.0
  extension_google_sign_in_as_googleapis_auth: ^3.0.0
  firebase_core: ^4.14.0
  firebase_auth: ^6.6.1
  cloud_firestore: ^6.9.0
  flutter_launcher_icons: ^0.14.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: "launcher_icon"
  image_path: "assets/icon.png"
  min_sdk_android: 21
  flutter_launcher_icons:
    android: true
    ios: true
    image_path: "assets/icon.png"